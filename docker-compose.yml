version: '3.8'

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  zabbix_db_data:

services:
  zabbix-db:
    image: mariadb:10.11
    container_name: zabbix-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M # Otimização de RAM para o MariaDB
    environment:
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_password"
      MYSQL_ROOT_PASSWORD: "root_password"
    volumes:
      - zabbix_db_data:/var/lib/mysql
    networks:
      - monitoring

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-6.4-latest
    container_name: zabbix-server
    restart: always
    ports:
      - "10051:10051"
    environment:
      DB_SERVER_HOST: "zabbix-db"
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_password"
      MYSQL_ROOT_PASSWORD: "root_password"
    depends_on:
      - zabbix-db
    networks:
      - monitoring

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-6.4-latest
    container_name: zabbix-web
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_SERVER_HOST: "zabbix-db"
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_password"
      ZBX_SERVER_HOST: "zabbix-server"
    depends_on:
      - zabbix-db
      - zabbix-server
    networks:
      - monitoring

  prometheus:
    build:
      context: ./prometheus
    image: fcg-prometheus:1.0.0
    container_name: prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d' # Limita dados a 15 dias para poupar disco e RAM
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    build:
      context: ./grafana
    image: fcg-grafana:1.0.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards-data/fcgames-observability.json
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring