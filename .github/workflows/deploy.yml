name: "Plan e Deploy Stack de Monitoramento"

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# Permissões necessárias para autenticação via OIDC
permissions:
  id-token: write # Requerido para solicitar o token OIDC
  contents: read  # Requerido para fazer checkout do código
  pull-requests: write # Permite adicionar o resultado do plan como comentário no PR

env:
  AWS_REGION: sa-east-1
  ROLE_TO_ASSUME: arn:aws:iam::915153720516:role/GitHubActions-Observabilidade-Deploy-Role

jobs:
  terraform-plan:
    name: "Terraform Plan (Validação)"
    runs-on: ubuntu-latest
    outputs:
      ec2_id: ${{ steps.tf-outputs.outputs.ec2_id }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: "1.5.0"
          working-directory: ./infra

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./infra
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infra

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        working-directory: ./infra

  terraform-apply-and-deploy:
    name: "Terraform Apply & Deploy Stack"
    needs: terraform-plan
    # Roda o Apply APENAS quando houver PUSH na branch develop (não roda em Pull Requests)
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: "1.5.0"
          working-directory: ./infra

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -auto-approve
          EC2_ID=$(terraform output -raw instance_id)
          echo "EC2_ID=$EC2_ID" >> $GITHUB_ENV
        working-directory: ./infra

      - name: Aguardar Inicialização do Docker na EC2
        run: sleep 30

      - name: Deploy Docker Compose via AWS SSM
        run: |
          echo "Enviando docker-compose.yml e executando deploy via SSM na instância $EC2_ID..."

          # 1. Converte o docker-compose.yml para Base64 (evita erros de escape no SSM)
          COMPOSE_B64=$(base64 -w 0 docker-compose.yml)

          # 2. Executa o script na EC2: decodifica o arquivo e sobe os containers
          aws ssm send-command \
            --instance-ids "$EC2_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Docker Compose Stack" \
            --parameters commands="[
              \"echo '$COMPOSE_B64' | base64 -d > /home/ubuntu/docker-compose.yml\",
              \"chown ubuntu:ubuntu /home/ubuntu/docker-compose.yml\",
              \"cd /home/ubuntu && docker compose pull && docker compose up -d\"
            ]"